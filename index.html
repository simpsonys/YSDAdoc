<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YSDAdoc Pages Index</title>
  <meta name="description" content="Index page for YSDAdoc GitHub Pages exports." />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --text: #eef2f8;
      --muted: #aab3c2;
      --line: rgba(255,255,255,.11);
      --accent: #8b5cf6;
      --accent-2: #22c55e;
      --danger: #fb7185;
      --shadow: 0 18px 60px rgba(0,0,0,.28);
      --radius: 18px;
      --max: 1120px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(139,92,246,.24), transparent 32rem),
        radial-gradient(circle at 90% 10%, rgba(34,197,94,.13), transparent 26rem),
        var(--bg);
      line-height: 1.6;
    }
    a { color: inherit; }
    .wrap { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; padding: 36px 0 64px; }
    header {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 52px);
    }
    .eyebrow { color: #c4b5fd; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .84rem; }
    h1 { margin: 10px 0 10px; font-size: clamp(2rem, 5vw, 4.2rem); line-height: 1.05; letter-spacing: -.04em; }
    .lead { max-width: 760px; color: var(--muted); font-size: 1.05rem; margin: 0; }
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;
      margin: 20px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(23,26,33,.78);
      backdrop-filter: blur(14px);
      position: sticky; top: 10px; z-index: 5;
    }
    .search { flex: 1 1 320px; display: flex; align-items: center; gap: 10px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: #10131a; color: var(--text); font: inherit; outline: none;
    }
    input:focus { border-color: rgba(139,92,246,.7); box-shadow: 0 0 0 3px rgba(139,92,246,.18); }
    button, .button {
      border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
      padding: 11px 14px; border-radius: 999px; font: inherit; cursor: pointer; text-decoration: none;
    }
    button:hover, .button:hover { border-color: rgba(139,92,246,.65); }
    .status { color: var(--muted); font-size: .94rem; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card {
      display: grid; gap: 10px; min-height: 170px;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: rgba(23,26,33,.82); box-shadow: 0 10px 28px rgba(0,0,0,.18);
      padding: 18px; text-decoration: none; transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(139,92,246,.55); background: rgba(30,34,43,.92); }
    .title { font-weight: 800; font-size: 1.06rem; line-height: 1.35; }
    .desc { color: var(--muted); font-size: .94rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .path { color: #c4b5fd; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; word-break: break-all; }
    .pill { justify-self: start; color: #bbf7d0; background: rgba(34,197,94,.13); border: 1px solid rgba(34,197,94,.2); border-radius: 999px; padding: 5px 9px; font-size: .78rem; }
    .empty, .error {
      border: 1px solid var(--line); border-radius: var(--radius); background: rgba(23,26,33,.82); padding: 24px; color: var(--muted);
    }
    .error strong { color: var(--danger); }
    footer { margin-top: 28px; color: var(--muted); font-size: .9rem; text-align: center; }
    code { color: #ddd6fe; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .wrap { width: min(calc(100% - 20px), var(--max)); padding-top: 18px; } .grid { grid-template-columns: 1fr; } .toolbar { position: static; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">GitHub Pages · YSDAdoc</div>
      <h1>YSDAdoc Pages Index</h1>
      <p class="lead">이 페이지는 <code>simpsonys/YSDAdoc</code> 저장소 안의 하위 <code>index.html</code> 페이지들을 모아서 보여주는 landing page입니다. MarkTL이 만든 공유 페이지를 GitHub Pages root에서 찾기 쉽게 만듭니다.</p>
    </header>

    <div class="toolbar">
      <div class="search">
        <input id="q" type="search" placeholder="Search title, description, or path…" autocomplete="off" />
      </div>
      <button id="reload" type="button">Reload</button>
      <a class="button" href="./marktl/">Open /marktl/</a>
      <span class="status" id="status">Loading…</span>
    </div>

    <main id="content" class="grid" aria-live="polite"></main>
    <footer>Generated for YSDAdoc. No token is used or embedded in this page.</footer>
  </div>

  <script>
    const CONFIG = {
      owner: 'simpsonys',
      repo: 'YSDAdoc',
      branch: 'main',
      pagesBase: 'https://simpsonys.github.io/YSDAdoc/',
      startPaths: ['marktl'],
      maxFiles: 300,
      exclude: new Set(['index.html', '404.html'])
    };

    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const qEl = document.getElementById('q');
    const reloadEl = document.getElementById('reload');
    let allPages = [];

    function pageUrlFromPath(path) {
      return CONFIG.pagesBase.replace(/\/+$/, '/') + path.replace(/\\/g, '/').replace(/index\.html$/i, '');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
    }

    function extractMeta(html, path) {
      const title = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.replace(/\s+/g, ' ').trim();
      const desc = html.match(/<meta\s+name=["']description["']\s+content=["']([\s\S]*?)["']/i)?.[1]
        || html.match(/<meta\s+property=["']og:description["']\s+content=["']([\s\S]*?)["']/i)?.[1];
      const fallbackTitle = path.replace(/\/index\.html$/i, '').split('/').filter(Boolean).pop() || path;
      return {
        title: title || fallbackTitle,
        description: desc ? desc.replace(/\s+/g, ' ').trim() : 'No description metadata found.',
      };
    }

    async function api(path = '') {
      const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}?ref=${encodeURIComponent(CONFIG.branch)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) throw new Error(`GitHub API ${res.status}: ${url}`);
      return res.json();
    }

    async function discover() {
      const queue = [...CONFIG.startPaths];
      const files = [];
      while (queue.length && files.length < CONFIG.maxFiles) {
        const path = queue.shift();
        let entries;
        try { entries = await api(path); } catch (err) { throw err; }
        if (!Array.isArray(entries)) entries = [entries];
        for (const entry of entries) {
          if (entry.type === 'dir') {
            if (!entry.path.includes('/.git') && !entry.path.includes('node_modules')) queue.push(entry.path);
          } else if (entry.type === 'file' && /(^|\/)index\.html$/i.test(entry.path) && !CONFIG.exclude.has(entry.path)) {
            files.push(entry);
          }
        }
      }
      return files;
    }

    async function hydrate(file) {
      let meta = { title: file.path, description: 'No description metadata found.' };
      try {
        const res = await fetch(file.download_url);
        if (res.ok) meta = extractMeta(await res.text(), file.path);
      } catch (_) {}
      return { path: file.path, url: pageUrlFromPath(file.path), ...meta };
    }

    function render() {
      const q = qEl.value.trim().toLowerCase();
      const pages = allPages.filter(p => !q || [p.title, p.description, p.path].join(' ').toLowerCase().includes(q));
      statusEl.textContent = `${pages.length} page(s)`;
      if (!pages.length) {
        contentEl.className = '';
        contentEl.innerHTML = '<div class="empty">No pages found. MarkTL output should contain files like <code>marktl/s/&lt;id&gt;/index.html</code> or <code>marktl/&lt;slug&gt;/index.html</code>.</div>';
        return;
      }
      contentEl.className = 'grid';
      contentEl.innerHTML = pages.map(p => `
        <a class="card" href="${escapeHtml(p.url)}">
          <span class="pill">HTML page</span>
          <div class="title">${escapeHtml(p.title)}</div>
          <div class="desc">${escapeHtml(p.description)}</div>
          <div class="path">${escapeHtml(p.path)}</div>
        </a>
      `).join('');
    }

    async function load() {
      statusEl.textContent = 'Loading…';
      contentEl.className = '';
      contentEl.innerHTML = '<div class="empty">Scanning repository contents…</div>';
      try {
        const files = await discover();
        const pages = [];
        for (const file of files) pages.push(await hydrate(file));
        allPages = pages.sort((a, b) => a.path.localeCompare(b.path));
        render();
      } catch (err) {
        statusEl.textContent = 'Load failed';
        contentEl.className = '';
        contentEl.innerHTML = `<div class="error"><strong>Could not load repository index.</strong><br>${escapeHtml(err.message)}<br><br>If this repository is private or GitHub API access is blocked, use the PowerShell generator version instead.</div>`;
      }
    }

    qEl.addEventListener('input', render);
    reloadEl.addEventListener('click', load);
    load();
  </script>
</body>
</html>
